media:
  input: static/images
  output: /images

content:
  - name: posts
    label: Blog Posts
    type: collection
    path: content/posts
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: title
      sort: date
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true

      - name: date
        label: Publication Date
        type: date

      - name: draft
        label: Draft
        type: boolean
        default: false

      - name: description
        label: Description
        type: text

      - name: tags
        label: Tags
        type: string
        list: true

      - name: categories
        label: Categories
        type: string
        list: true

      - name: body
        label: Content
        type: rich-text
        options:
          format: markdown
          media: images

settings:
  content:
    merge: true