name: Deploy Hugo Website on GitHub Pages
on:
  push:
    branches:
      - main # Set a branch to deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive # Fetch Hugo themes (true OR recursive)
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true
      - name: Install Dart Sass
        run: |
          mkdir -p "$HOME/.local/lib/dart-sass"
          RELEASE_URL=$(curl -s https://api.github.com/repos/sass/dart-sass/releases/latest \
            | jq -r '.assets[] | select(.name | endswith("linux-x64.tar.gz")) | .browser_download_url' \
            | head -n 1)
          curl -L "$RELEASE_URL" -o /tmp/dart-sass.tar.gz
          tar -xzf /tmp/dart-sass.tar.gz -C "$HOME/.local/lib"
          echo "$HOME/.local/lib/dart-sass" >> "$GITHUB_PATH"
          "$HOME/.local/lib/dart-sass/sass" --embedded --version
      - name: Build
        working-directory: ./myblog
        run: hugo --minify
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./myblog/public
          publish_branch: gh-pages
